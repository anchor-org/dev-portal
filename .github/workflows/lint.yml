name: Lint API docs

on:
  pull_request:
    branches: [main]
    # No paths filter here on purpose — this is a required status check.
    # A path-filtered trigger simply never fires on a PR that doesn't touch
    # those paths (e.g. build-docs.yml's own index.html-only PR), and a
    # required check that never reports blocks merging forever. Runs fast
    # (a few seconds) so running it unconditionally costs nothing.
  push:
    branches: [main]
    paths:
      - "docs/**.yaml"
      - "docs/**.yml"
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint OpenAPI specs
        run: |
          for f in docs/*.yaml docs/*.yml; do
            [ -e "$f" ] || continue
            npx --yes @redocly/cli@latest lint "$f"
          done
